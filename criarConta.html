<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcessoLivre</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS local -->
  <link rel="stylesheet" href="CSS/Style.css">
  <link rel="icon" href="IMGs/AcessoLivre.png">
</head>

<body class="bg-green-900 text-white flex flex-col min-h-screen">

 <!-- Header -->
  <header>

    <!-- Navbar -->
    <nav class="bg-green-800 p-4 flex justify-between items-center">
      <button id="menuButton" aria-label="Abrir menu de navegação">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h1 class="text-xl font-bold"><a href="index.html">AcessoLivre</a></h1>

      <a href="index.html"><img src="IMGs/AcessoLivre.png" alt="Logo do AcessoLivre, um ícone de mapa estilizado"
          class="w-8 h-8 rounded-full"></a>

    </nav>

    <!-- Menu Lateral -->
    <div id="sideMenu" role="dialog" aria-modal="true" aria-labelledby="sideMenuTitle"
      class="fixed top-0 left-0 h-full w-64 bg-gray-100 text-black transform -translate-x-full transition-transform duration-200 ease-in-out shadow-lg z-50">
      <div class="p-4 border-b flex items-center justify-between">
        <h2 class="font-bold text-lg" id="sideMenuTitle">AcessoLivre</h2>
        <button id="closeMenu" class="text-gray-600" aria-label="Fechar menu">&times;</button>
      </div>

      <ul class="p-4 space-y-3">
        <li class="flex items-center gap-2 cursor-pointer hover:text-green-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <a href="index.html#barra-pesquisa">Pesquisar</a>
        </li>

        <li class="flex items-center gap-2 cursor-pointer hover:text-green-700">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" aria-hidden="true"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
          </svg>
          <a href="favoritos.html">Favoritos</a>
        </li>

        <li class="flex items-center gap-2 cursor-pointer hover:text-green-700">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" aria-hidden="true"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <a id="login-link" href="login.html">Login</a>
        </li>

        <hr>

        <li class="flex items-center gap-2 cursor-pointer hover:text-green-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <a href="criarConta.html">Criar Conta</a>
        </li>
      </ul>
    </div>

  </header>

  <!-- Conteúdo principal -->
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-lg md:text-xl font-bold mb-6 text-center">
      Crie sua conta agora mesmo!
    </h2>

    <form id="form-criar-conta"
      class="bg-white text-black rounded-md p-6 w-full max-w-xs md:max-w-md space-y-4 shadow-lg">
      <div>
        <label for="nome" class="block mb-1">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome"
          class="w-full p-2 md:p-3 rounded border border-gray-300" required>
      </div>

      <button type="submit" class="w-full bg-green-800 text-white p-2 md:p-3 rounded hover:bg-green-700 transition">
        Criar Conta
      </button>

      <!-- Aqui aparece a mensagem do backend -->
      <div id="mensagem" class="mt-4 text-center font-semibold"></div>

    </form>


    <p class="mt-4 text-center text-sm md:text-base">
      Já possui uma conta?
      <a href="login.html" class="underline">Faça login</a>
    </p>
  </main>

  <!-- Footer -->
  <footer class="bg-green-800 text-white">
    <div class="max-w-screen-xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
      <div class="mb-4 md:mb-0">
        <h2 class="text-lg font-bold">AcessoLivre</h2>
        <p class="text-sm">Facilitando acessibilidade na sua cidade</p>
      </div>
      <div class="flex space-x-4">
        <a href="sobre.html" class="hover:underline">Sobre</a>
        <a href="https://www.instagram.com/acesso_livre.ifce/" class="hover:underline">Contato</a>
      </div>
    </div>
    <div class="text-center py-2 text-xs">
      © 2025 AcessoLivre. Todos os direitos reservados.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="JS/script.js" defer></script>
  <script src="JS/conexaoUsuario.js" defer></script>
</body>

</html>
