  <!-- Script -->
  <script>
    // Simulação de favoritos salvos (isso virá do backend no futuro)
    const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

    const lista = document.getElementById("listaFavoritos");
    const semFavoritos = document.getElementById("sem-favoritos");

    if (favoritos.length > 0) {
      favoritos.forEach(local => {
        const item = document.createElement("div");
        item.className = "bg-white text-black p-4 rounded shadow";
        item.innerHTML = `
                    <h3 class="font-bold">${local.nome}</h3>
                    <p class="text-sm">${local.descricao}</p>
                    <div class="flex space-x-2 mt-2">
                        <button class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600" onclick="removerFavorito('${local.id}')">Remover</button>
                        <a href="${local.link}" target="_blank" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">Ver no mapa</a>
                    </div>
                `;
        lista.appendChild(item);
      });
    } else {
      semFavoritos.classList.remove("hidden");
    }

    function removerFavorito(id) {
      const novosFavoritos = favoritos.filter(local => local.id !== id);
      localStorage.setItem("favoritos", JSON.stringify(novosFavoritos));
      location.reload();
    }
  </script>
